# dx project configuration for the Podcast sample.
#
# The samples are ordinary dx projects on purpose. Someone reading one should see the
# layout they would get from `dx new`, not a special arrangement that only works inside
# this repository, because the point of a sample is to be copied.

[application]
name = "Podcast"
asset_dir = "assets"

[bundle]
identifier = "dev.darkpyonix.dioxus.compose.samples.podcast"
publisher = "DarkPyonix"
short_description = "A podcast hub with a drawn waveform."
long_description = "New episodes, an episode you can open, and a player whose waveform is a Canvas painted entirely in roles."

[macos]
bundle_name = "Podcast"
