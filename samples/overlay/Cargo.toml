[package]
name = "sample-html-overlay"
version = "0.0.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "A dropdown menu, a confirmation dialog over a dimmed backdrop, and a clipped preview"
publish = false

[lib]
# The sample is an application and its tests, not a benchmark. Without this `cargo bench`
# runs the lib's test harness with Criterion's flags, which it rejects.
bench = false

[dependencies]
dioxus-compose = { path = "../../dioxus-compose" }
dioxus-hooks.workspace = true
dioxus-signals.workspace = true
