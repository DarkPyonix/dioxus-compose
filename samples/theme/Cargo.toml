[package]
name = "sample-html-theme"
version = "0.0.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "A page coloured by CSS custom properties, with a light and a dark set and a button that overrides the system"
publish = false

[lib]
# The sample is an application and its tests, not a benchmark. Without this `cargo bench`
# runs the lib's test harness with Criterion's flags, which it rejects.
bench = false

[dependencies]
dioxus-compose = { path = "../../dioxus-compose" }
dioxus-hooks.workspace = true
dioxus-signals.workspace = true
