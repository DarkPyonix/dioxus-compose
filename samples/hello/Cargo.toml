[package]
name = "sample-html-hello"
version = "0.0.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "A heading, a paragraph with bold and italic words, and a link that counts its clicks, written with HTML and CSS"
publish = false

# Three shapes of the same page. The rlib is what the binary and the tests use; the cdylib
# is what an Android Activity loads and what a browser page fetches, because neither of
# those platforms runs a `main` of ours.
[lib]
name = "sample_html_hello"
path = "src/lib.rs"
# The staticlib is iOS. There the renderer is a Kotlin/Native archive and the two are
# linked into one executable, so the page cannot be a shared library: a cdylib would have
# to resolve the renderer's symbols at link time and they are not there yet.
crate-type = ["rlib", "cdylib", "staticlib"]
# The sample is an application and its tests, not a benchmark. Without this `cargo bench`
# runs the lib's test harness with Criterion's flags, which it rejects.
bench = false

[dependencies]
dioxus-compose = { path = "../../dioxus-compose" }
dioxus-hooks.workspace = true

[dev-dependencies]
sample-html-support = { path = "../support" }

# The window. Not a benchmark: without this `cargo bench` runs the binary with
# Criterion's flags, which its plain test harness rejects.
[[bin]]
name = "sample-html-hello"
path = "src/main.rs"
bench = false
