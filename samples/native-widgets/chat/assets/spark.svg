<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
  <!-- A four pointed spark, drawn as four wedges meeting at the centre so each arm can
       take a colour of its own. The waists pull in, which is what makes the shape read as
       light rather than as a compass.

       Four wedges rather than two crossed quadrilaterals, which is how this was drawn
       first: the second shape covered half of the first, so two of the four colours never
       reached the screen and the mark came out blue and orange. -->
  <defs>
    <linearGradient id="tl" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#4285F4"/>
      <stop offset="1" stop-color="#1A73E8"/>
    </linearGradient>
    <linearGradient id="tr" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1A73E8"/>
      <stop offset="1" stop-color="#4285F4"/>
    </linearGradient>
    <linearGradient id="br" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#D96570"/>
      <stop offset="1" stop-color="#EA4335"/>
    </linearGradient>
    <linearGradient id="bl" x1="1" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#FBBC05"/>
      <stop offset="1" stop-color="#34A853"/>
    </linearGradient>
  </defs>
  <path d="M24 24 L24 2 C22 14 14 22 2 24 Z" fill="url(#tl)"/>
  <path d="M24 24 L24 2 C26 14 34 22 46 24 Z" fill="url(#tr)"/>
  <path d="M24 24 L46 24 C34 26 26 34 24 46 Z" fill="url(#br)"/>
  <path d="M24 24 L24 46 C22 34 14 26 2 24 Z" fill="url(#bl)"/>
</svg>
