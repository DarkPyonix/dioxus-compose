[package]
name = "sample-html-landing"
version = "0.0.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "A responsive product landing page: a hero, a feature grid, three pricing plans and a footer, with width media queries"
publish = false

[lib]
# The sample is an application and its tests, not a benchmark. Without this `cargo bench`
# runs the lib's test harness with Criterion's flags, which it rejects.
bench = false

[dependencies]
dioxus-compose = { path = "../../dioxus-compose" }
dioxus-hooks.workspace = true
dioxus-signals.workspace = true

[dev-dependencies]
sample-html-support = { path = "../support" }
