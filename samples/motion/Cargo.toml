[package]
name = "sample-html-motion"
version = "0.0.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Rotated, scaled and skewed boxes, a transition started by a button, looping keyframes and a width that animates, written with HTML and CSS"
publish = false

[lib]
# The sample is an application and its tests, not a benchmark. Without this `cargo bench`
# runs the lib's test harness with Criterion's flags, which it rejects.
bench = false

[dependencies]
dioxus-compose = { path = "../../dioxus-compose" }
dioxus-hooks.workspace = true
dioxus-signals.workspace = true

[dev-dependencies]
sample-html-support = { path = "../support" }
