[package]
name = "sample-notepad"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
dioxus-compose = { path = "../../dioxus-compose" }
dioxus-hooks.workspace = true
# A worker thread has to hand its result back to the UI thread, and the library offers no
# channel for that, so the sample brings its own.
futures-channel = "0.3"

# The sample is an application, not a benchmark. Without this `cargo bench` runs the
# binary with Criterion's flags, which its plain test harness rejects.
[[bin]]
name = "sample-notepad"
path = "src/main.rs"
bench = false
