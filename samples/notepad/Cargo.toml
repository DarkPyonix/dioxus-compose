[package]
name = "sample-notepad"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
dioxus-compose = { path = "../../dioxus-compose" }
# rsx! expands to paths that name these crates directly, so a consumer has to depend on
# them even though it never writes their names. That is a wart in our public API rather
# than something a sample should be teaching, and it is tracked as such.
dioxus-core.workspace = true
dioxus-signals.workspace = true
dioxus-hooks.workspace = true
# A worker thread has to hand its result back to the UI thread, and the library offers no
# channel for that, so the sample brings its own.
futures-channel = "0.3"

# The default bin harness does not understand Criterion's flags, and a workspace
# bench run passes them to every target. A sample has nothing to benchmark.
[[bin]]
name = "sample-notepad"
path = "src/main.rs"
bench = false
