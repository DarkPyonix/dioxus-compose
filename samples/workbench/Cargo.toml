[package]
name = "sample-html-workbench"
version = "0.0.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "A small code editor screen: activity bar, collapsible file tree, editor tabs and a status bar"
publish = false

[lib]
# The sample is an application and its tests, not a benchmark. Without this `cargo bench`
# runs the lib's test harness with Criterion's flags, which it rejects.
bench = false

[dependencies]
dioxus-compose = { path = "../../dioxus-compose" }
dioxus-hooks.workspace = true
dioxus-signals.workspace = true
