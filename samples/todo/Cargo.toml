[package]
name = "sample-todo"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

# Three shapes of the same sample. The rlib is what the binary and the tests use; the
# cdylib is what an Android Activity loads and what a browser page fetches, because
# neither of those platforms runs a `main` of ours.
[lib]
name = "sample_todo"
path = "src/lib.rs"
crate-type = ["rlib", "cdylib"]
bench = false

[dependencies]
dioxus-compose = { path = "../../dioxus-compose" }
dioxus-hooks.workspace = true

[dev-dependencies]
sample-frames = { path = "../frames" }

# The sample is an application, not a benchmark. Without this `cargo bench` runs the
# binary with Criterion's flags, which its plain test harness rejects.
[[bin]]
name = "sample-todo"
path = "src/main.rs"
bench = false
