# dx project configuration for the Todo sample.
#
# The samples are ordinary dx projects on purpose. Someone reading one should see the
# layout they would get from `dx new`, not a special arrangement that only works inside
# this repository, because the point of a sample is to be copied.
#
# What is specific to this project is the renderer: dx builds and bundles the application,
# and the Compose renderer is linked in by dioxus-compose's build script. Nothing in this
# file selects a renderer.

[application]
name = "Todo"
asset_dir = "assets"

[bundle]
identifier = "dev.darkpyonix.dioxus.compose.samples.todo"
publisher = "DarkPyonix"
short_description = "A task list built with dioxus-compose."
long_description = "Stable keys, lazy list windowing, persistence."

[macos]
# The window draws its own title bar, so the bundle asks for a plain window and the
# renderer takes over the chrome.
bundle_name = "Todo"

[android]
# The renderer is Kotlin running on ART rather than an AOT image, which is the one
# platform where that is true, so Android needs the Compose runtime resolved at build
# time and an Activity that hosts a Compose view instead of a NativeActivity.
#
# Neither line is wired up yet: the Android renderer does not exist (M6). They are here so
# the shape is visible and reviewable, and they are commented out so a build does not fail
# on a dependency that is not published.
#
# gradle_dependencies = ["androidx.activity:activity-compose:1.13.0"]
#
# The Activity is replaced through `application.android_main_activity`, which dx reads as
# a path to a MainActivity.kt to use instead of its generated one. That is the hook that
# lets a Compose host replace dx's NativeActivity entry point.
