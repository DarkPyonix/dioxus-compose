[package]
name = "sample-html-article"
version = "0.0.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "A reading page with headings, wrapping paragraphs, lists, a quotation and a code block, written with HTML and CSS"
publish = false

[lib]
# The sample is an application and its tests, not a benchmark. Without this `cargo bench`
# runs the lib's test harness with Criterion's flags, which it rejects.
bench = false

[dependencies]
dioxus-compose = { path = "../../dioxus-compose" }

[dev-dependencies]
sample-html-support = { path = "../support" }
