[package]
name = "sample-html-typography"
version = "0.0.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "A type specimen page: sizes, weights, spacing, alignment, white space, generated content, lists and decorations, written with HTML and CSS"
publish = false

[lib]
name = "sample_html_typography"
path = "src/lib.rs"
# The rlib is what the binary and the tests use; the cdylib is what an Android Activity
# loads and what a browser page fetches; the staticlib is linked into an iOS executable
# beside the renderer, as in `hello`.
crate-type = ["rlib", "cdylib", "staticlib"]
# The sample is an application and its tests, not a benchmark. Without this `cargo bench`
# runs the lib's test harness with Criterion's flags, which it rejects.
bench = false

[dependencies]
dioxus-compose = { path = "../../dioxus-compose" }
dioxus-hooks.workspace = true
dioxus-signals.workspace = true

[dev-dependencies]
sample-html-support = { path = "../support" }

# The window. Not a benchmark: without this `cargo bench` runs the binary with
# Criterion's flags, which its plain test harness rejects.
[[bin]]
name = "sample-html-typography"
path = "src/main.rs"
bench = false
