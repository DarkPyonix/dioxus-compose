# CI -- the fast quality gate. Runs on every pull request and every push.
#
# This workflow is deliberately Rust-only. `scripts/check.sh` (fmt, clippy,
# tests, --quick benchmarks) finishes in minutes, so it can gate every PR.
# The GraalVM native-image build of the renderer is *not* here: it needs a
# ~1GB Liberica NIK download and tens of minutes of native-image compilation
# (INTENT D9-macOS), which is too slow to put in front of every push. That
# build lives in native-renderer.yml, on a schedule and on pushes to main.
#
# INTENT D7 is the reason this split is legitimate: the development path (JVM
# / Rust) and the distribution path (native-image) are separate by design, and
# SPEC NFR-5 states the native-image build is not part of the development loop.
#
# macOS is the primary platform (SPEC PR-8), but the Host crate itself is
# portable, so Linux is in the matrix too: it costs nothing extra in wall time
# and it catches accidental macOS-only assumptions in the Rust code early.

name: CI

on:
  # Only what is about to become public, or what already is. Work lands on develop many
  # times an hour and running the matrix on each push is noise rather than signal. Every
  # release reaches main as a pull request, so the gate still runs before anything is
  # published, which is the moment that matters.
  # The pull request only. `release` reaches `main` through a pull request that a human
  # merges, so that run is the gate, and it finishes before main moves. Running again on
  # the push afterwards tested the identical tree and doubled every number on the actions
  # page for nothing.
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  # One in-flight run per branch or PR; superseded runs are cancelled.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Keep the cache small and the link step quick; CI never needs a debugger.
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

jobs:
  rust:
    name: Rust quality gate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macos-latest is Apple silicon, which is the platform SPEC PR-8
        # describes and the one the benchmark baseline was measured on.
        os: [macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install the pinned Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable
          rustc --version
          cargo --version

      - name: Cache cargo registry and build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      - name: Run the quality gate
        # fmt, clippy -D warnings, tests, and the SPEC 5.1 budget benchmarks in
        # Criterion's quick mode. The budgets have ~37x headroom against the
        # recorded baseline, so shared-runner noise does not make them flaky;
        # the benchmark *assertions* (NFR-9) still fail the build if a real
        # regression lands.
        #
        # Without the Kotlin half. check.sh runs it by default, which is right on a
        # developer's machine and wrong here: this job is named for Rust, has no Kotlin
        # caches, and so spent most of ten minutes downloading the Kotlin/Native compiler
        # and the wasm toolchain before doing eight seconds of work. The kotlin job below
        # runs it once, with the caches that make it cheap.
        env:
          DXC_SKIP_KOTLIN: '1'
        run: ./scripts/check.sh

  kotlin:
    # One job per platform, not one job for all of them.
    #
    # `./kotlin build` with no argument compiles every module for every platform it
    # declares, and the design systems declare five each. That put the Kotlin/Native
    # compiler, its platform libraries and the wasm toolchain on the critical path of a
    # gate whose JVM half finishes in seconds, and it serialised work that has no reason
    # to be serial: measured warm here, jvm 4s, android 4s, wasmJs 11s, iosSimulatorArm64
    # 21s. Sequentially that is the sum; split, it is the slowest one.
    #
    # The split also keeps each cache honest. The jvm and android jobs never download
    # konan at all, and a Kotlin/Native toolchain change no longer invalidates the cache
    # of the job that finishes first.
    name: Kotlin gate (${{ matrix.platform }})
    runs-on: ${{ matrix.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # The renderer's desktop module and every UI test live here. macOS because it is
          # the primary platform and the one the Compose desktop tests are written against.
          - platform: jvm
            runs-on: macos-latest
            test: true
          # Kotlin/Native. Compiles the iOS renderer, which shares its interpreter sources
          # with the desktop one through symlinks, and runs the protocol codec tests on it.
          - platform: iosSimulatorArm64
            runs-on: macos-latest
            test: true
          # The device slice is linked, never run: running it needs a signed app on real
          # hardware. Building it is what proves the arm64 slice still compiles.
          - platform: iosArm64
            runs-on: macos-latest
            test: false
          # Compiled, not run. These are pure logic tests, and they already run on the
          # jvm, iOS and Android targets, so nothing is uncovered by not running them a
          # fourth time. What is lost is the harness: a browser test loads skiko's wasm
          # module, and on this runner it arrives truncated, which aborts before any test
          # starts (`section (code 10, "Code") extends past end of the module`). It does
          # not reproduce here, where the same command passes, so this is the toolchain or
          # the runner rather than the code under test. Turn it back on when the web target
          # is actually being built, which is when a browser failure would mean something.
          - platform: wasmJs
            runs-on: ubuntu-latest
            test: false
          - platform: android
            runs-on: ubuntu-latest
            test: true
    steps:
      - uses: actions/checkout@v4

      - name: Cache the Kotlin toolchain, konan and Maven dependencies
        # Keyed on the platform as well as the inputs, so each job carries only what it
        # actually downloads instead of every job restoring every toolchain.
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/JetBrains/Kotlin
            ~/.cache/JetBrains/Kotlin
            ~/.konan
            ~/.m2/repository
          key: kotlin-${{ matrix.platform }}-${{ runner.os }}-${{ hashFiles('dioxus-compose-renderer/**/module.yaml', 'dioxus-compose-renderer/libs.versions.toml', 'dioxus-compose-renderer/kotlin', 'dioxus-design-systems/**/module.yaml') }}
          restore-keys: |
            kotlin-${{ matrix.platform }}-${{ runner.os }}-

      - name: Build the renderer
        working-directory: dioxus-compose-renderer
        run: ./kotlin build -p ${{ matrix.platform }}

      - name: Test the renderer
        if: matrix.test
        working-directory: dioxus-compose-renderer
        run: ./kotlin test -p ${{ matrix.platform }}

      - name: Build the design systems
        # A separate Amper project, and deliberately so: it must never depend on the
        # renderer, which is what lets it be published on its own.
        working-directory: dioxus-design-systems
        run: ./kotlin build -p ${{ matrix.platform }}

      - name: Test the design systems
        if: matrix.test
        working-directory: dioxus-design-systems
        run: ./kotlin test -p ${{ matrix.platform }}

  shell:
    name: Shell script tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Both, because some of these scripts are platform specific and skip elsewhere.
        # install-nik.sh only means anything on macOS, so running the suite on Linux alone
        # would silently cover none of it.
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Run scripts/tests
        # scripts/publish-main.sh and scripts/install-nik.sh carry their own
        # tests; they run against throwaway temporary directories only.
        run: |
          set -euo pipefail
          for test in scripts/tests/*.test.sh; do
            echo "== $test"
            bash "$test"
          done

  packaging:
    name: crates.io packaging check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install the pinned Rust toolchain
        run: rustup toolchain install stable --profile minimal && rustup default stable

      # Guards the distribution plan: the Host crate must stay publishable as a
      # plain crate while the ~85MB renderer ships as a release artifact.
      #
      # The verification build inside `cargo package` uses default features, which
      # now include the renderer, so this also exercises the path a consumer takes:
      # the packaged crate has no workspace to fall back on and has to fetch the
      # artifact for its own version from the release. That is the point. If the
      # release for this version has no Linux renderer, a consumer on Linux cannot
      # build, and this job is where that is discovered.
      - name: cargo package
        run: cargo package -p dioxus-compose
