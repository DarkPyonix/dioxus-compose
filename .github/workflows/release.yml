# Release -- builds the renderer per platform and attaches it to a GitHub
# Release when a version tag is pushed.
#
# Why artifacts instead of crates.io: the renderer distribution is the Compose
# native-image shared library plus Skia, roughly 85MB. crates.io rejects
# packages that large, and a binary blob has no business in a source crate
# anyway. So the split is:
#
#   - `dioxus-compose` (the Rust Host) stays an ordinary crate. It builds with
#     default features and no renderer present; only the optional
#     `native-renderer` feature needs the shared library.
#   - the renderer ships as a checksummed tarball on the GitHub Release for
#     this tag, one per platform, fetched at build or install time.
#
# Every platform the project claims has to be in the matrix below, and the crate
# publish waits for all of them. A crate version on crates.io can be yanked but
# never replaced, and its build script points at the release artifact for its own
# version, so publishing while a platform is missing would leave anyone on that
# platform with a version that can never be made to work.
#
# Pushing a version tag also publishes the crate to crates.io. That needs a
# CARGO_REGISTRY_TOKEN secret, and the job refuses to run if the tag and the
# version in Cargo.toml disagree, because publishing cannot be undone: a
# version can be yanked but never replaced, and the name is taken forever.
# Add a required reviewer to the `crates-io` environment if you want a human
# in that loop.
#
# The GitHub Release itself is created as a *draft*, so the renderer artifacts
# are reviewed before anyone can download them.

name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build a draft release for'
        required: true
        type: string

permissions:
  contents: read

jobs:
  renderer:
    name: Build the renderer (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            target: macos-aarch64
            build: ./dioxus-compose-renderer/desktop/scripts/build-native.sh
            smoke: ./dioxus-compose-renderer/desktop/scripts/smoke-test.sh
            dist: dioxus-compose-renderer/build/native-image/dist
          - runner: windows-2022
            target: windows-x64
            build: .\dioxus-compose-renderer\desktop\scripts\build-native-windows.ps1
            smoke: .\dioxus-compose-renderer\desktop\scripts\smoke-test-windows.ps1
            dist: dioxus-compose-renderer/build/native-image/dist
          - runner: ubuntu-24.04
            target: linux-x64
            build: ./dioxus-compose-renderer/desktop/scripts/build-native-linux.sh
            smoke: ./dioxus-compose-renderer/desktop/scripts/smoke-test-linux.sh
            dist: dioxus-compose-renderer/build/native-image-linux/dist
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Cache Liberica NIK
        if: runner.os == 'macOS'
        uses: actions/cache@v4
        with:
          path: ~/.cache/dioxus-compose/nik
          key: nik-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/install-nik.sh') }}

      - name: Install Liberica NIK 25 Full
        # macOS only: upstream GraalVM has no AWT there, and Liberica does.
        if: runner.os == 'macOS'
        run: ./scripts/install-nik.sh --github-env

      - name: Install upstream GraalVM for JDK 25
        # Upstream supports AWT on Windows and Linux, so neither needs Liberica.
        if: runner.os != 'macOS'
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25'
          distribution: ${{ runner.os == 'Windows' && 'graalvm' || 'graalvm-community' }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install the Linux AWT, Skia, font and virtual display dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential zlib1g-dev unzip pkg-config fontconfig \
            libx11-dev libxext-dev libxi-dev libxrender-dev libxtst-dev libxrandr-dev \
            libfontconfig1-dev libfreetype6-dev libgl1 libgl1-mesa-dri \
            fonts-noto-cjk xvfb xauth dbus-x11

      - name: Cache the Kotlin toolchain and Maven dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/JetBrains/Kotlin
            ~/.cache/JetBrains/Kotlin
            ~/AppData/Local/JetBrains/Kotlin
            ~/.m2/repository
          key: kotlin-${{ runner.os }}-${{ hashFiles('dioxus-compose-renderer/kotlin', 'dioxus-compose-renderer/libs.versions.toml', 'dioxus-compose-renderer/**/module.yaml') }}
          restore-keys: |
            kotlin-${{ runner.os }}-

      - name: Build the renderer shared library
        shell: ${{ runner.os == 'Windows' && 'powershell' || 'bash' }}
        # Linux draws through a virtual display; the other two have one.
        run: ${{ runner.os == 'Linux' && format('xvfb-run -a {0}', matrix.build) || matrix.build }}

      - name: Smoke test before shipping
        # Nothing ships that cannot start, render and exit cleanly on its own platform.
        shell: ${{ runner.os == 'Windows' && 'powershell' || 'bash' }}
        env:
          DIOXUS_COMPOSE_AUTOEXIT_MS: '5000'
        run: ${{ runner.os == 'Linux' && format('xvfb-run -a {0}', matrix.smoke) || matrix.smoke }}

      - name: Package the distribution with a checksum
        id: package
        # bash on every runner, Windows included, so one script packages all three.
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          version="${{ inputs.tag || github.ref_name }}"
          name="dioxus-compose-renderer-${version}-${TARGET}"
          # dist/ holds the renderer, Skia and the AWT libraries, plus include/.
          # Linux stages its own directory, and Windows keeps the DLLs in bin/ so the
          # loader finds them together.
          tar -czf "${name}.tar.gz" -C "${{ matrix.dist }}" .
          if command -v shasum >/dev/null; then
            shasum -a 256 "${name}.tar.gz" > "${name}.tar.gz.sha256"
          else
            sha256sum "${name}.tar.gz" > "${name}.tar.gz.sha256"
          fi
          cat "${name}.tar.gz.sha256"
          echo "name=${name}" >> "$GITHUB_OUTPUT"

      - name: Upload for the release job
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.name }}
          path: |
            ${{ steps.package.outputs.name }}.tar.gz
            ${{ steps.package.outputs.name }}.tar.gz.sha256
          retention-days: 7

  release:
    name: Draft the GitHub Release
    needs: renderer
    runs-on: ubuntu-latest
    permissions:
      # The only write permission anywhere in this repository's workflows, and
      # it is scoped to this job: it creates a draft release and uploads files.
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Download the platform artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Collect the checksums into one file
        run: |
          set -euo pipefail
          cat artifacts/*.sha256 > artifacts/SHA256SUMS
          cat artifacts/SHA256SUMS

      - name: Create or update the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" artifacts/*.tar.gz artifacts/*.sha256 artifacts/SHA256SUMS --clobber
          else
            gh release create "$TAG" \
              --draft \
              --title "$TAG" \
              --notes "Renderer artifacts for \`$TAG\`. Verify with \`shasum -a 256 -c SHA256SUMS\`. Review, then publish by hand." \
              artifacts/*.tar.gz artifacts/*.sha256 artifacts/SHA256SUMS
          fi

  publish-crate:
    name: Publish dioxus-compose to crates.io
    needs: release
    runs-on: ubuntu-latest
    # Publishing cannot be undone: a version can be yanked but never replaced, and the
    # name is taken forever. Add a required reviewer to this environment in the repository
    # settings if you want a human to approve each one; with no reviewer configured it
    # runs straight through, which is the intended behaviour for a tag push.
    environment: crates-io
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Install the pinned Rust toolchain
        run: rustup toolchain install stable --profile minimal && rustup default stable

      - name: The tag and Cargo.toml must agree
        # A tag that does not match the manifest would publish a version nobody asked for,
        # under a number that then can never be reused.
        run: |
          set -euo pipefail
          tag="${{ inputs.tag || github.ref_name }}"
          manifest="$(cargo metadata --no-deps --format-version 1 |
            python3 -c 'import json,sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"]=="dioxus-compose"))')"
          if [[ "$tag" != "v$manifest" ]]; then
            echo "tag $tag does not match dioxus-compose $manifest in Cargo.toml" >&2
            echo "Publishing would release a version that no commit claims. Fix one or the other." >&2
            exit 1
          fi
          echo "tag $tag matches Cargo.toml $manifest"

      - name: Publish
        # Default features only, so this is exactly what a consumer gets: the Host crate
        # with no renderer. The renderer is the artifact the release job attached above.
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish -p dioxus-compose
