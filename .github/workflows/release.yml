# Release -- builds the renderer per platform and attaches it to a GitHub
# Release when a version tag is pushed.
#
# Why artifacts instead of crates.io: the renderer distribution is the Compose
# native-image shared library plus Skia, roughly 85MB. crates.io rejects
# packages that large, and a binary blob has no business in a source crate
# anyway. So the split is:
#
#   - `dioxus-compose` (the Rust Host) stays an ordinary crate. It builds with
#     default features and no renderer present; only the optional
#     `native-renderer` feature needs the shared library.
#   - the renderer ships as a checksummed tarball on the GitHub Release for
#     this tag, one per platform, fetched at build or install time.
#
# Every platform the project claims has to be in the matrix below, and the crate
# publish waits for all of them. A crate version on crates.io can be yanked but
# never replaced, and its build script points at the release artifact for its own
# version, so publishing while a platform is missing would leave anyone on that
# platform with a version that can never be made to work.
#
# Pushing a version tag also publishes the crate to crates.io. That needs a
# CARGO_REGISTRY_TOKEN secret, and the job refuses to run if the tag and the
# version in Cargo.toml disagree, because publishing cannot be undone: a
# version can be yanked but never replaced, and the name is taken forever.
# Add a required reviewer to the `crates-io` environment if you want a human
# in that loop.
#
# The GitHub Release itself is created as a *draft*, so the renderer artifacts
# are reviewed before anyone can download them.

name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build a draft release for'
        required: true
        type: string

permissions:
  contents: read

jobs:
  # The same definition the verification workflow uses, so a platform or a check cannot
  # exist on one path and not the other. `version` is what turns the staged directory into
  # the checksummed tarball this release attaches.
  renderer:
    uses: ./.github/workflows/renderer.yml
    with:
      ref: ${{ inputs.tag || github.ref }}
      version: ${{ inputs.tag || github.ref_name }}

  release:
    name: Draft the GitHub Release
    needs: renderer
    runs-on: ubuntu-latest
    permissions:
      # The only write permission anywhere in this repository's workflows, and
      # it is scoped to this job: it creates a draft release and uploads files.
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Download the platform artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Collect the checksums into one file
        run: |
          set -euo pipefail
          cat artifacts/*.sha256 > artifacts/SHA256SUMS
          cat artifacts/SHA256SUMS

      - name: Create or update the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" artifacts/*.tar.gz artifacts/*.sha256 artifacts/SHA256SUMS --clobber
          else
            gh release create "$TAG" \
              --draft \
              --title "$TAG" \
              --notes "Renderer artifacts for \`$TAG\`. Verify with \`shasum -a 256 -c SHA256SUMS\`. Review, then publish by hand." \
              artifacts/*.tar.gz artifacts/*.sha256 artifacts/SHA256SUMS
          fi

  publish-crate:
    name: Publish dioxus-compose to crates.io
    needs: release
    runs-on: ubuntu-latest
    # Publishing cannot be undone: a version can be yanked but never replaced, and the
    # name is taken forever. Add a required reviewer to this environment in the repository
    # settings if you want a human to approve each one; with no reviewer configured it
    # runs straight through, which is the intended behaviour for a tag push.
    environment: crates-io
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Install the pinned Rust toolchain
        run: rustup toolchain install stable --profile minimal && rustup default stable

      - name: The tag and Cargo.toml must agree
        # A tag that does not match the manifest would publish a version nobody asked for,
        # under a number that then can never be reused.
        run: |
          set -euo pipefail
          tag="${{ inputs.tag || github.ref_name }}"
          manifest="$(cargo metadata --no-deps --format-version 1 |
            python3 -c 'import json,sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"]=="dioxus-compose"))')"
          if [[ "$tag" != "v$manifest" ]]; then
            echo "tag $tag does not match dioxus-compose $manifest in Cargo.toml" >&2
            echo "Publishing would release a version that no commit claims. Fix one or the other." >&2
            exit 1
          fi
          echo "tag $tag matches Cargo.toml $manifest"

      - name: Publish
        # Default features only, so this is exactly what a consumer gets: the Host crate
        # with no renderer. The renderer is the artifact the release job attached above.
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish -p dioxus-compose
