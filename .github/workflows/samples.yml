# Sample apps -- builds every sample for every desktop platform when a `sample-v*` tag is
# pushed, and attaches the binaries to a GitHub Release.
#
# A sample that does not build on a platform is skipped and the release goes ahead with
# the rest. Eleven samples across three platforms is thirty-three builds, and holding all
# of them back because one of them broke on one platform helps nobody. A platform where
# nothing at all built is a different thing and still fails the run.
#
# Separate from release.yml on purpose. That workflow ships the library: the renderer
# artifacts and the crate. This one ships programs a person downloads and runs, and the
# two should be versioned apart so a sample can be rebuilt without implying a library
# release, and a library release is not held up by a sample that does not build.
#
# Each sample links the renderer for its platform, so the binary is self contained apart
# from the renderer library shipped beside it.

name: Sample apps

on:
  push:
    tags:
      - 'sample-v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing sample-v* tag to build a release for'
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            target: macos-aarch64
            renderer: ./dioxus-compose-renderer/desktop/scripts/build-native.sh
            dist: dioxus-compose-renderer/build/native-image/dist/lib
          - runner: ubuntu-24.04
            target: linux-x64
            renderer: ./dioxus-compose-renderer/desktop/scripts/build-native-linux.sh
            dist: dioxus-compose-renderer/build/native-image-linux/dist/lib
          - runner: ubuntu-24.04-arm
            target: linux-arm64
            renderer: ./dioxus-compose-renderer/desktop/scripts/build-native-linux.sh
            dist: dioxus-compose-renderer/build/native-image-linux/dist/lib
            # Community rather than the Oracle build: there is no free Oracle GraalVM for
            # Linux on arm64, which is the same reason the renderer's own workflow pins
            # this pair for this runner and no other.
            distribution: graalvm-community
            java-version: '25.0.1'
          - runner: windows-2022
            target: windows-x64
            renderer: powershell .\dioxus-compose-renderer\desktop\scripts\build-native-windows.ps1
            # `dist`, not `dist/lib`. Windows puts the DLL in `dist\bin` and the JDK's
            # font configuration in `dist\lib`, because AWT reads that from java.home and
            # the renderer sets java.home to `dist`. The search order looks in a given
            # directory and then in its `bin` and `lib`, so naming the parent finds both.
            dist: dioxus-compose-renderer/build/native-image/dist
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Install the pinned Rust toolchain
        run: rustup toolchain install stable --profile minimal && rustup default stable

      - name: Take Git's coreutils out of the linker's way
        # Git for Windows carries a coreutils `link` in usr/bin, and a bash step finds it
        # before the MSVC linker, so every Rust build dies at `extra operand` before
        # reaching a single sample.
        #
        # Renaming that one file rather than rearranging PATH, and rather than reaching
        # for an action that sets up the whole developer environment: the runner already
        # has a working MSVC toolchain that cargo finds on its own, and the only thing
        # wrong is one name being shadowed. Setting up a second environment to fix one
        # shadowed name is how `VsDevCmd.bat failed to initialise the x64 compiler
        # environment` happened.
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          shadow="/c/Program Files/Git/usr/bin/link.exe"
          if [ -f "$shadow" ]; then
            mv "$shadow" "$shadow.coreutils"
            echo "moved the coreutils link out of the way"
          fi
          echo "link.exe now resolves to: $(command -v link || echo 'nothing on PATH')"

      - name: Install Liberica NIK 25 Full
        if: runner.os == 'macOS'
        run: ./scripts/install-nik.sh --github-env

      - name: Install upstream GraalVM 25
        # Upstream GraalVM ships AWT on Windows and Linux. Only macOS needs Liberica.
        if: runner.os != 'macOS'
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: ${{ matrix.java-version || '25' }}
          distribution: ${{ matrix.distribution || 'graalvm' }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Linux AWT, Skia and font dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # patchelf rewrites each packaged executable's DT_NEEDED entry to the renderer
          # travelling beside it, in place of the absolute path this runner built with.
          sudo apt-get install -y build-essential zlib1g-dev pkg-config fontconfig \
            libx11-dev libxext-dev libxi-dev libxrender-dev libxtst-dev libxrandr-dev \
            libfontconfig1-dev libfreetype6-dev libgl1 libgl1-mesa-dri libegl1 \
            fonts-noto-cjk \
            patchelf xvfb xauth dbus-x11

      - name: Cache the Kotlin toolchain and Maven dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/JetBrains/Kotlin
            ~/.cache/JetBrains/Kotlin
            ~/.m2/repository
          key: kotlin-${{ matrix.target }}-${{ hashFiles('dioxus-compose-renderer/**/module.yaml') }}
          restore-keys: kotlin-${{ matrix.target }}-

      - name: Build the renderer
        # Linux gets its own step rather than a branch inside one. The Windows command is
        # a PowerShell invocation with backslashes in it, and running that through bash
        # to reach an `if` would eat them.
        if: runner.os != 'Linux'
        run: ${{ matrix.renderer }}

      - name: Build the renderer under a virtual display
        # The Linux build starts a Compose JVM to collect reachability metadata, and that
        # needs a display even though nobody looks at it. The script says so itself when
        # DISPLAY is unset, and says to do exactly this.
        if: runner.os == 'Linux'
        run: xvfb-run -a ${{ matrix.renderer }}

      - name: Build every sample against it
        # A sample that does not build is skipped rather than allowed to end the run. The
        # point of this workflow is to put programs in front of people, and one sample
        # failing to compile on one platform is not a reason to ship none of the other ten
        # anywhere. Which ones built is written to `built.txt` and the packaging step
        # reads it, so a sample that failed here cannot be packaged from a stale binary
        # left by an earlier run.
        shell: bash
        env:
          # Absolute. A build script runs with its crate directory as the working
          # directory, not the workspace root, so a relative path here points at
          # dioxus-compose/dioxus-compose-renderer/... and finds nothing.
          DIOXUS_COMPOSE_RENDERER_DIR: ${{ github.workspace }}/${{ matrix.dist }}
        run: |
          set -uo pipefail
          : > built.txt
          : > skipped.txt
          for manifest in samples/*/Cargo.toml; do
            app="$(basename "$(dirname "$manifest")")"
            # Only the ones that are programs. `frames` is a library the others record
            # their screens through, so it builds and then has no binary to ship, which
            # is not a failure and must not be reported as one.
            if [[ ! -f "samples/$app/src/main.rs" ]]; then
              echo "-- $app is a library, not an application"
              continue
            fi
            echo "== sample-$app"
            if cargo build --release -p "sample-$app" --features dioxus-compose/native-renderer; then
              echo "$app" >> built.txt
            else
              echo "$app" >> skipped.txt
              echo "::warning title=Sample skipped::sample-$app did not build for ${{ matrix.target }}"
            fi
          done
          echo "built:"; cat built.txt
          echo "skipped:"; cat skipped.txt
          # Nothing at all is a different case. That is the renderer or the toolchain
          # being wrong rather than one sample being wrong, and shipping an empty platform
          # quietly would hide it.
          if [[ ! -s built.txt ]]; then
            echo "::error title=No samples built::every sample failed on ${{ matrix.target }}, which is the platform being broken rather than a sample"
            exit 1
          fi

      - name: Package each sample with the renderer beside it
        # A sample is only runnable next to the renderer library it was linked against, so
        # ship them together rather than leaving the download to fail at startup.
        #
        # The build records the absolute path the renderer was at on this runner, which is
        # the only way a binary that merely depends on the crate finds it without an rpath.
        # That path means nothing on the machine someone downloads this to, so the last
        # step points each executable at the copy travelling with it. Without it the
        # archives would ship a runner's directory layout and fail to start.
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          while read -r app; do
            [[ -n "$app" ]] || continue
            stage="staging/$app"
            mkdir -p "$stage"
            cp -R "${{ matrix.dist }}/." "$stage/"
            if [[ "${{ runner.os }}" == "Windows" ]]; then
              # The executable goes in beside the DLL rather than above it. Windows
              # searches the directory the executable is in, and the renderer's DLL lives
              # in `bin` because AWT reads its font configuration from the `lib` next to
              # it: the renderer sets java.home to their parent, so the two have to stay
              # where they are and the program comes to them.
              cp "target/release/sample-$app.exe" "$stage/bin/"
            else
              cp "target/release/sample-$app" "$stage/"
              # Everywhere else the library records the absolute path it was built at,
              # which means nothing on the machine this is unpacked on, so each executable
              # is pointed at the copy travelling with it.
              ./scripts/bundle-renderer.sh "$stage/sample-$app" .
            fi
            tar -czf "artifacts/$app-${{ matrix.target }}.tar.gz" -C staging "$app"
          done < built.txt
          cd artifacts
          if command -v sha256sum >/dev/null; then sha256sum *.tar.gz > "SHA256SUMS-${{ matrix.target }}"
          else shasum -a 256 *.tar.gz > "SHA256SUMS-${{ matrix.target }}"; fi
          cat "SHA256SUMS-${{ matrix.target }}"

      - uses: actions/upload-artifact@v4
        with:
          name: samples-${{ matrix.target }}
          path: artifacts/


  android:
    name: android
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Install the pinned Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal && rustup default stable
          rustup target add aarch64-linux-android

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install the NDK
        # The runner already has an Android SDK with its licences accepted, so the setup
        # action is a second one that tries to accept them again and fails inside
        # sdkmanager. Only the NDK is missing, and the SDK that is here can fetch it.
        run: |
          set -euo pipefail
          sdk="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          "$sdk/cmdline-tools/latest/bin/sdkmanager" --install "ndk;27.1.12297006"
          echo "ANDROID_NDK_HOME=$sdk/ndk/27.1.12297006" >> "$GITHUB_ENV"

      - name: Cache the Kotlin toolchain and Maven dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/JetBrains/Kotlin
            ~/.m2/repository
          key: kotlin-android-${{ hashFiles('dioxus-compose-renderer/**/module.yaml') }}
          restore-keys: kotlin-android-

      - name: Build an APK for every sample
        run: ./scripts/build-sample-apks.sh artifacts arm64-v8a

      - name: Checksum
        run: |
          cd artifacts
          sha256sum *.apk > SHA256SUMS-android
          cat SHA256SUMS-android

      - uses: actions/upload-artifact@v4
        with:
          name: samples-android
          path: artifacts/

  ios:
    name: ios-simulator
    runs-on: macos-26
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Install the pinned Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal && rustup default stable
          rustup target add aarch64-apple-ios-sim

      - name: Cache the Kotlin toolchain and Maven dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/JetBrains/Kotlin
            ~/.m2/repository
          key: kotlin-ios-${{ hashFiles('dioxus-compose-renderer/**/module.yaml') }}
          restore-keys: kotlin-ios-

      - name: Build the renderer for the simulator
        run: ./dioxus-compose-renderer/desktop/scripts/build-ios.sh --target simulator

      - name: Wrap every sample in an application bundle
        # Simulator only. A bundle for a device has to be signed by a certificate Apple
        # issued against a profile naming that device, and there is none here.
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p artifacts
          built=0
          for manifest in samples/*/Cargo.toml; do
            sample="$(basename "$(dirname "$manifest")")"
            # An application rather than a library: every sample is a library now.
            [[ -f "samples/$sample/src/main.rs" ]] || continue
            if ./dioxus-compose-renderer/desktop/scripts/build-sample-ios.sh "$sample" --release; then
              tar -czf "artifacts/$sample-ios-simulator.tar.gz" \
                -C dioxus-compose-renderer/build/ios/samples "sample-$sample.app"
              built=$((built + 1))
            else
              echo "::warning title=Sample skipped::$sample did not build for the iOS simulator"
            fi
          done
          [[ $built -gt 0 ]] || { echo "::error::no sample built for iOS"; exit 1; }
          cd artifacts && shasum -a 256 *.tar.gz > SHA256SUMS-ios-simulator

      - uses: actions/upload-artifact@v4
        with:
          name: samples-ios-simulator
          path: artifacts/

  web:
    name: web
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Install the pinned Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal && rustup default stable
          rustup target add wasm32-unknown-unknown

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache the Kotlin toolchain and Maven dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/JetBrains/Kotlin
            ~/.m2/repository
          key: kotlin-web-${{ hashFiles('dioxus-compose-renderer/**/module.yaml') }}
          restore-keys: kotlin-web-

      - name: Build a page for every sample
        run: ./scripts/build-sample-pages.sh pages

      - name: Pack the pages as one archive
        run: |
          set -euo pipefail
          mkdir -p artifacts
          tar -czf artifacts/samples-web.tar.gz -C pages .
          cd artifacts && sha256sum samples-web.tar.gz > SHA256SUMS-web

      - uses: actions/upload-artifact@v4
        with:
          name: samples-web
          path: artifacts/

  release:
    name: Attach the samples to the release
    needs: [build, android, ios, web]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/download-artifact@v4
        with:
          path: downloaded

      - name: Collect
        run: |
          set -euo pipefail
          mkdir -p artifacts
          find downloaded -type f -exec cp {} artifacts/ \;
          ls -la artifacts

      - name: Say which sample and platform pairs are in this release
        id: notes
        run: |
          set -euo pipefail
          {
            echo "Sample applications, one archive per sample per platform."
            echo
            echo "A desktop archive contains the program and the renderer library it was"
            echo "linked against; run it from the extracted directory. Android ships an"
            echo "APK per sample. iOS ships a simulator bundle per sample, because a"
            echo "bundle for a device has to be signed by a certificate Apple issued"
            echo "against a profile naming that device. The web archive is every sample"
            echo "as a page, with an index linking them."
            echo
            echo 'Verify with `shasum -a 256 -c SHA256SUMS-<platform>`.'
            echo
            echo "Built in this release:"
            echo
            for archive in artifacts/*.tar.gz artifacts/*.apk; do
              [ -e "$archive" ] || continue
              echo "- $(basename "$archive")"
            done
            echo
            echo "A sample that does not build on a platform is skipped rather than"
            echo "holding up the rest, so a pair missing from the list above failed to"
            echo "compile there. The workflow log says which."
          } > notes.md
          cat notes.md

      - name: Create or update the release
        # Published rather than drafted. A draft is invisible to everyone but the people
        # with write access to this repository, so a release nobody can download is the
        # same as no release at all.
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" artifacts/* --clobber
            gh release edit "$TAG" --draft=false --notes-file notes.md
          else
            gh release create "$TAG" \
              --title "Sample apps $TAG" \
              --notes-file notes.md \
              artifacts/*
          fi
