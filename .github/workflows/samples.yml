# Sample apps -- builds every sample for every desktop platform when a `sample-v*` tag is
# pushed, and attaches the binaries to a GitHub Release.
#
# A sample that does not build on a platform is skipped and the release goes ahead with
# the rest. Eleven samples across three platforms is thirty-three builds, and holding all
# of them back because one of them broke on one platform helps nobody. A platform where
# nothing at all built is a different thing and still fails the run.
#
# Separate from release.yml on purpose. That workflow ships the library: the renderer
# artifacts and the crate. This one ships programs a person downloads and runs, and the
# two should be versioned apart so a sample can be rebuilt without implying a library
# release, and a library release is not held up by a sample that does not build.
#
# Each sample links the renderer for its platform, so the binary is self contained apart
# from the renderer library shipped beside it.

name: Sample apps

on:
  push:
    tags:
      - 'sample-v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing sample-v* tag to build a release for'
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            target: macos-aarch64
            renderer: ./dioxus-compose-renderer/desktop/scripts/build-native.sh
            dist: dioxus-compose-renderer/build/native-image/dist/lib
          - runner: ubuntu-24.04
            target: linux-x86_64
            renderer: ./dioxus-compose-renderer/desktop/scripts/build-native-linux.sh
            dist: dioxus-compose-renderer/build/native-image-linux/dist/lib
          - runner: windows-2022
            target: windows-x86_64
            renderer: powershell .\dioxus-compose-renderer\desktop\scripts\build-native-windows.ps1
            dist: dioxus-compose-renderer/build/native-image/dist/lib
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Install the pinned Rust toolchain
        run: rustup toolchain install stable --profile minimal && rustup default stable

      - name: Install Liberica NIK 25 Full
        if: runner.os == 'macOS'
        run: ./scripts/install-nik.sh --github-env

      - name: Install upstream GraalVM 25
        # Upstream GraalVM ships AWT on Windows and Linux. Only macOS needs Liberica.
        if: runner.os != 'macOS'
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25'
          distribution: 'graalvm'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Linux AWT, Skia and font dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # patchelf rewrites each packaged executable's DT_NEEDED entry to the renderer
          # travelling beside it, in place of the absolute path this runner built with.
          sudo apt-get install -y build-essential zlib1g-dev pkg-config fontconfig \
            libx11-dev libxext-dev libxi-dev libxrender-dev libxtst-dev libxrandr-dev \
            libfontconfig1-dev libfreetype6-dev libgl1 fonts-noto-cjk patchelf

      - name: Cache the Kotlin toolchain and Maven dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/JetBrains/Kotlin
            ~/.cache/JetBrains/Kotlin
            ~/.m2/repository
          key: kotlin-${{ matrix.target }}-${{ hashFiles('dioxus-compose-renderer/**/module.yaml') }}
          restore-keys: kotlin-${{ matrix.target }}-

      - name: Build the renderer
        run: ${{ matrix.renderer }}

      - name: Build every sample against it
        # A sample that does not build is skipped rather than allowed to end the run. The
        # point of this workflow is to put programs in front of people, and one sample
        # failing to compile on one platform is not a reason to ship none of the other ten
        # anywhere. Which ones built is written to `built.txt` and the packaging step
        # reads it, so a sample that failed here cannot be packaged from a stale binary
        # left by an earlier run.
        shell: bash
        env:
          DIOXUS_COMPOSE_RENDERER_DIR: ${{ matrix.dist }}
        run: |
          set -uo pipefail
          : > built.txt
          : > skipped.txt
          for manifest in samples/*/Cargo.toml; do
            app="$(basename "$(dirname "$manifest")")"
            echo "== sample-$app"
            if cargo build --release -p "sample-$app" --features dioxus-compose/native-renderer; then
              echo "$app" >> built.txt
            else
              echo "$app" >> skipped.txt
              echo "::warning title=Sample skipped::sample-$app did not build for ${{ matrix.target }}"
            fi
          done
          echo "built:"; cat built.txt
          echo "skipped:"; cat skipped.txt
          # Nothing at all is a different case. That is the renderer or the toolchain
          # being wrong rather than one sample being wrong, and shipping an empty platform
          # quietly would hide it.
          if [[ ! -s built.txt ]]; then
            echo "::error title=No samples built::every sample failed on ${{ matrix.target }}, which is the platform being broken rather than a sample"
            exit 1
          fi

      - name: Package each sample with the renderer beside it
        # A sample is only runnable next to the renderer library it was linked against, so
        # ship them together rather than leaving the download to fail at startup.
        #
        # The build records the absolute path the renderer was at on this runner, which is
        # the only way a binary that merely depends on the crate finds it without an rpath.
        # That path means nothing on the machine someone downloads this to, so the last
        # step points each executable at the copy travelling with it. Without it the
        # archives would ship a runner's directory layout and fail to start.
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          while read -r app; do
            [[ -n "$app" ]] || continue
            stage="staging/$app"
            mkdir -p "$stage"
            if [[ "${{ runner.os }}" == "Windows" ]]; then
              cp "target/release/sample-$app.exe" "$stage/"
            else
              cp "target/release/sample-$app" "$stage/"
            fi
            cp -R "${{ matrix.dist }}/." "$stage/"
            # Windows is already done by the copy: a DLL is found on the loader's search
            # path, which the executable's own directory is on, and no name inside either
            # file is consulted.
            if [[ "${{ runner.os }}" != "Windows" ]]; then
              ./scripts/bundle-renderer.sh "$stage/sample-$app" .
            fi
            tar -czf "artifacts/$app-${{ matrix.target }}.tar.gz" -C staging "$app"
          done < built.txt
          cd artifacts
          if command -v sha256sum >/dev/null; then sha256sum *.tar.gz > "SHA256SUMS-${{ matrix.target }}"
          else shasum -a 256 *.tar.gz > "SHA256SUMS-${{ matrix.target }}"; fi
          cat "SHA256SUMS-${{ matrix.target }}"

      - uses: actions/upload-artifact@v4
        with:
          name: samples-${{ matrix.target }}
          path: artifacts/

  release:
    name: Attach the samples to the release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/download-artifact@v4
        with:
          path: downloaded

      - name: Collect
        run: |
          set -euo pipefail
          mkdir -p artifacts
          find downloaded -type f -exec cp {} artifacts/ \;
          ls -la artifacts

      - name: Say which sample and platform pairs are in this release
        id: notes
        run: |
          set -euo pipefail
          {
            echo "Sample applications, one archive per sample per platform."
            echo
            echo "Each archive contains the program and the renderer library it was linked"
            echo "against; run it from the extracted directory. Verify with"
            echo '`shasum -a 256 -c SHA256SUMS-<platform>`.'
            echo
            echo "Built in this release:"
            echo
            for archive in artifacts/*.tar.gz; do
              echo "- $(basename "$archive" .tar.gz)"
            done
            echo
            echo "A sample that does not build on a platform is skipped rather than"
            echo "holding up the rest, so a pair missing from the list above failed to"
            echo "compile there. The workflow log says which."
          } > notes.md
          cat notes.md

      - name: Create or update the release
        # Published rather than drafted. A draft is invisible to everyone but the people
        # with write access to this repository, so a release nobody can download is the
        # same as no release at all.
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" artifacts/* --clobber
            gh release edit "$TAG" --draft=false --notes-file notes.md
          else
            gh release create "$TAG" \
              --title "Sample apps $TAG" \
              --notes-file notes.md \
              artifacts/*
          fi
