# The renderer for Linux, without a virtual machine in it.
#
# The same renderer the desktop native image builds, compiled for the platform directly:
# `src/shared/` holds symlinks into `desktop/src/`, so there is one copy of the interpreter
# and one copy of the generated protocol. The boundary is the iOS one, which is Kotlin
# native and POSIX and names neither platform, so it is shared rather than written twice.
#
# What this is for: the native image carries a Java runtime, and most of what a Linux
# distribution of it weighs is that runtime rather than anything drawn. It also carries AWT
# and its X11 toolkit, which is a second window system underneath the one the renderer opens.
#
# The window is `src/LinuxWindow.kt`: Xlib, GLX and the sync extension reached through
# `cinterop/x11.def`. Windows has no Kotlin/Native Compose target and keeps the native image
# path, which is why `desktop/c/x11_window.c` is still there: Windows links it for the names
# it answers, and it is the window the native image opens.
product:
  type: lib
  platforms: [ linuxX64 ]

# Where the patched Compose comes from. Compose Multiplatform publishes no Kotlin/Native
# target for Linux at all, so every module below is built from source here: `patches/` says
# what the target needs that upstream does not have, and `scripts/build-compose.sh --target
# linuxX64` builds and publishes them under the version asked for. skiko has a published
# linuxX64 target and is resolved normally, as a dependency of Compose UI.
repositories:
  - mavenLocal

# Named by the coordinate of the target rather than by the shorthand. The shorthand asks
# for a module's root, whose metadata lists which targets it has, and the root is published
# by a task the toolchain skips on a machine that is not building every target at once. The
# target's own coordinate carries the klib and says what it is, which is the whole of what
# is needed here. Runtime keeps the shorthand: upstream publishes that one for this target.
#
# Every module is named, not only the four the renderer draws with, because a coordinate
# that points at one target carries no list of what it needs and nothing is brought in
# behind it. The list is what `scripts/build-compose.sh` publishes; the two have to agree
# and `linux-native-window.test.sh` says so when they stop agreeing.
dependencies:
  - $compose.runtime
  - org.jetbrains.compose.animation:animation-linuxx64:1.11.1
  - org.jetbrains.compose.animation:animation-core-linuxx64:1.11.1
  - org.jetbrains.compose.foundation:foundation-linuxx64:1.11.1
  - org.jetbrains.compose.foundation:foundation-layout-linuxx64:1.11.1
  - org.jetbrains.compose.material:material-ripple-linuxx64:1.11.1
  - org.jetbrains.compose.material3:material3-linuxx64:1.11.0-alpha07
  - org.jetbrains.compose.ui:ui-linuxx64:1.11.1
  - org.jetbrains.compose.ui:ui-backhandler-linuxx64:1.11.1
  - org.jetbrains.compose.ui:ui-geometry-linuxx64:1.11.1
  - org.jetbrains.compose.ui:ui-graphics-linuxx64:1.11.1
  - org.jetbrains.compose.ui:ui-text-linuxx64:1.11.1
  - org.jetbrains.compose.ui:ui-tooling-preview-linuxx64:1.11.1
  - org.jetbrains.compose.ui:ui-unit-linuxx64:1.11.1
  - org.jetbrains.compose.ui:ui-util-linuxx64:1.11.1

test-dependencies:
  - $kotlin.test

settings:
  compose: enabled
  kotlin:
    optIns:
      - kotlinx.cinterop.ExperimentalForeignApi
      - kotlinx.cinterop.BetaInteropApi
