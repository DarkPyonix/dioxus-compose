# The renderer for Android (M6).
#
# The interpreter sources are the same files the desktop renderer builds: `src/shared/`
# holds symlinks into `desktop/src/`, so there is one copy of the interpreter and one copy
# of the generated protocol. Everything under `src/bridge/` is the Android half of the
# boundary: the generated JNI declarations instead of the GraalVM ones, a connection that
# reads the Host's arena through a direct byte buffer, and Android's own picture decoding.
#
# The module cannot depend on `desktop` instead, because that one is a `jvm/app`.
product: android/app

dependencies:
  - $compose.runtime
  - $compose.foundation
  - $compose.material3
  - $compose.ui
  - $libs.androidx.activity.compose
  - $compose.preview
  - $compose.uiTooling

settings:
  compose: enabled
  android:
    namespace: dioxus.compose
    applicationId: dioxus.compose
    # The Rust Host is built for this API level (android/scripts/build-host.sh).
    minSdk: 26
