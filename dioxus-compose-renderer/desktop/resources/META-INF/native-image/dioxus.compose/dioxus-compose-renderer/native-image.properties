# The two classes that hold a CEntryPointLiteral, the address of a function in the image that
# the window calls while its edge is dragged. Native Image fills a literal in only while it
# builds, so both are initialised then, on every desktop. A class reachable on a platform it
# is not meant for (the Windows window class is reachable from the platform switch on macOS
# and Linux too) still has its literal, and a literal created at run time is not possible.
Args = --initialize-at-build-time=dioxus.compose.ui.platform.X11FrameCallback,dioxus.compose.ui.platform.Win32DrawCallback
