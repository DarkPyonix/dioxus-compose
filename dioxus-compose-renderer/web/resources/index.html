<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DioxusCompose</title>
    <link type="text/css" rel="stylesheet" href="styles.css">
</head>
<body style="text-align: center; align-content: center">
    <svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 50 50" role="presentation">
        <circle cx="25" cy="25" r="20" stroke="#ccc" stroke-width="4" fill="none"/>
        <circle cx="25" cy="25" r="20" stroke="#333" stroke-width="4" fill="none" stroke-linecap="round"
                stroke-dasharray="90 125">
            <animateTransform attributeName="transform" type="rotate" from="0 25 25" to="360 25 25" dur="1s"
                              repeatCount="indefinite"/>
        </circle>
    </svg>
    <!--
      The Host, compiled before the renderer's own module is evaluated.

      Module scripts run in the order they appear, and this one has a top level await, so
      by the time the renderer starts the Host's module is compiled and waiting. It cannot
      be instantiated yet: it imports the linear memory, and that memory does not exist
      until the renderer's module is instantiated. The renderer's `main` closes the circle.

      A page with no Host beside it still comes up. The loader says so on the console and
      the renderer draws its development host.
    -->
    <script src="dioxus-compose-host.gen.mjs" type="module"></script>
    {{kotlin.scripts}}
</body>
</html>
