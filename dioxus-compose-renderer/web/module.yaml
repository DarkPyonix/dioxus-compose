# The renderer for the web (M7).
#
# The interpreter sources are the same files the desktop renderer builds: `src/shared/`
# holds symlinks into `desktop/src/`, so there is one copy of the interpreter and one copy
# of the generated protocol. Everything else under `src/` is the web half of the boundary:
# the generated forwarder declarations instead of the GraalVM ones, a `java.nio` shim over
# wasm linear memory, and the browser's own `Intl` tables for the pickers.
#
# The module cannot depend on `desktop` instead, because that one is a `jvm/app`.
product: wasm-js/app

dependencies:
  - $compose.runtime
  - $compose.foundation
  - $compose.material3
  - $compose.ui

test-dependencies:
  - $kotlin.test

settings:
  compose: enabled
