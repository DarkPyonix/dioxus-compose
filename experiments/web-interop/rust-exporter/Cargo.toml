# Standalone crate: an empty [workspace] table keeps it out of the repository
# workspace so `cargo` at the repository root never sees it (PR-6 experiment,
# nothing else may depend on it).
[workspace]

[package]
name = "web-interop-rust-exporter"
version = "0.0.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[profile.release]
opt-level = 3
lto = true
panic = "abort"
