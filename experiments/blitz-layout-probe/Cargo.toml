# Deliberately outside the workspace. This measures a crate the project is considering, not
# anything the project publishes, and its own `[workspace]` keeps it out of the member list
# and out of the shared build directory.
[workspace]

[package]
name = "blitz-layout-probe"
edition = "2024"
publish = false

[dependencies]
# Pinned to the versions the probe was written against, so that a later release cannot
# change the numbers without anyone noticing.
blitz-dom = "=0.2.4"
blitz-html = "=0.2.0"
blitz-traits = "=0.2.0"
# The same versions blitz-dom 0.2.4 resolves, named here because the probe reads Parley's
# line items and runs stylo's CSS parser with an error reporter.
parley = "=0.6.0"
style = { package = "stylo", version = "=0.8.0" }
cssparser = "0.35"
serde_json = "1"

[profile.release]
debug = true
