<!doctype html>
<html><head><style>
*, *::before, *::after {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: system-ui, sans-serif;
    font-size: 16px;
    line-height: 24px;
    color: #1f2328;
    background: #ffffff;
}

.hero {
    display: flex;
    align-items: center;
    gap: 16px;
    height: 160px;
    padding: 0 32px;
    background-image: linear-gradient(to right, #4f46e5, #06b6d4);
    color: #ffffff;
}

.avatar {
    border-radius: 50%;
}

.hero h1 {
    margin: 0;
    font-size: 28px;
    line-height: 36px;
}

.hero p {
    margin: 0;
}

.grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
    grid-auto-rows: 140px;
    gap: 12px;
    padding: 16px;
}

.tile {
    margin: 0;
    border-radius: 8px;
    overflow: hidden;
    background: #eaeef2;
    cursor: pointer;
}

.tile.wide {
    grid-column: span 2;
}

.tile img {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: cover;
}

.tile img.whole {
    object-fit: contain;
}

.postcard {
    background-image: url(textures/postcard.png);
    background-size: cover;
    background-position: center;
}
</style></head><body><header id="hero" class="hero"><img id="avatar" class="avatar" src="avatars/me.png" alt="Me"><div><h1>Summer in Lisbon</h1><p id="subtitle">6 photos and a postcard</p></div></header><section id="grid" class="grid"><figure id="tile-0" class="tile wide"><img id="photo-0" class="" src="photos/tram.jpg" alt="Tram 28 on the hill"></figure><figure id="tile-1" class="tile"><img id="photo-1" class="" src="photos/tiles.jpg" alt="Azulejos"></figure><figure id="tile-2" class="tile"><img id="photo-2" class="" src="photos/river.jpg" alt="The Tagus at dusk"></figure><figure id="tile-3" class="tile"><img id="photo-3" class="" src="photos/castle.jpg" alt="Castle walls"></figure><figure id="tile-4" class="tile"><img id="photo-4" class="" src="photos/bakery.jpg" alt="Pasteis de nata"></figure><figure id="tile-5" class="tile"><img id="photo-5" class="whole" src="maps/route.png" alt="Where we walked"></figure><div id="postcard" class="tile postcard"></div></section></body></html>
