<!doctype html>
<html><head><style>
*, *::before, *::after {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: system-ui, sans-serif;
    font-size: 14px;
    line-height: 20px;
    color: #1f2328;
    background: #ffffff;
}

.settings {
    max-width: 560px;
    padding: 32px;
}

h1 {
    margin: 0 0 24px;
    font-size: 24px;
    line-height: 32px;
}

.field {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 16px;
}

.field.tall {
    align-items: flex-start;
}

.field > label,
.group-label {
    width: 120px;
    flex-shrink: 0;
    margin: 0;
    color: #57606a;
}

.control {
    flex: 1;
    min-width: 0;
    height: 36px;
    padding: 7px 11px;
    border: 1px solid #d0d7de;
    border-radius: 6px;
    background: #ffffff;
    color: #1f2328;
    font: inherit;
}

textarea.control {
    height: 96px;
}

.group {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    margin-bottom: 16px;
}

.options {
    display: flex;
    flex-direction: column;
    gap: 8px;
}

.check {
    display: flex;
    align-items: center;
    gap: 8px;
}

.check input {
    width: 16px;
    height: 16px;
    margin: 0;
}

.actions {
    display: flex;
    align-items: center;
    gap: 12px;
    padding-left: 132px;
}

.save {
    height: 36px;
    padding: 0 16px;
    border: 0;
    border-radius: 6px;
    background: #1f883d;
    color: #ffffff;
    font: inherit;
    font-weight: 600;
    cursor: pointer;
}

.status {
    margin: 0;
    color: #1a7f37;
}
</style></head><body><form id="settings" class="settings"><h1>Settings</h1><div class="field"><label id="name-label" for="name">Display name</label><input id="name" class="control" type="text" placeholder="Your name" value="Ada Lovelace"></div><div class="field tall"><label id="bio-label" for="bio">Bio</label><textarea id="bio" class="control" placeholder="A line about you" value="Writes programs for engines that do not exist yet.">Writes programs for engines that do not exist yet.</textarea></div><div class="field"><label id="theme-label" for="theme">Theme</label><select id="theme" class="control" value="system"><option value="light">Light</option><option value="dark">Dark</option><option value="system" selected>Match the system</option></select></div><div class="group"><p class="group-label">Email</p><div class="options"><label class="check"><input id="weekly" type="checkbox" checked="true">Send me a weekly summary</label></div></div><div class="group"><p class="group-label">Density</p><div class="options"><label class="check"><input type="radio" name="density" id="density-0" value="Comfortable" checked="true">Comfortable</label><label class="check"><input type="radio" name="density" id="density-1" value="Compact">Compact</label></div></div><div class="actions"><button id="save" class="save" type="button">Save changes</button></div></form></body></html>
