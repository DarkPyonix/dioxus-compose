<!doctype html>
<html><head><style>
* { box-sizing: border-box; }
html, body { margin: 0; }
body { font-family: system-ui, sans-serif; font-size: 16px; color: #0f172a; background-color: #f8fafc; }

.page { padding: 24px; }
.row { display: flex; align-items: flex-start; gap: 80px; height: 120px; padding: 20px 0; }

.cell { flex: none; width: 80px; height: 80px; padding: 10px; background-color: #6366f1; }
.inner { width: 20px; height: 20px; background-color: #f59e0b; }
#rotate { transform: rotate(15deg); }
#scale { transform: scale(1.5); }
#skew { transform: skewX(10deg); }
#origin { transform: rotate(45deg); transform-origin: top left; }
#combo { transform: translate(10px, 5px) rotate(30deg) scale(0.5); }

button {
    flex: none;
    width: 100px;
    height: 32px;
    padding: 0;
    border: 0;
    border-radius: 6px;
    background-color: #334155;
    color: #f8fafc;
}

.fader {
    flex: none;
    width: 80px;
    height: 80px;
    background-color: #94a3b8;
    opacity: 0.3;
    transition: opacity 0.4s ease, background-color 0.4s ease, transform 0.4s ease;
}
.fader.lit {
    background-color: #22c55e;
    opacity: 1;
    transform: translateX(20px) rotate(10deg);
}

@keyframes spin {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
}
@keyframes pulse {
    from { opacity: 0.3; }
    to { opacity: 1; }
}
.spinner {
    flex: none;
    width: 40px;
    height: 40px;
    background-color: #ef4444;
    animation: spin 2s linear infinite;
}
.pulse {
    flex: none;
    width: 80px;
    height: 40px;
    background-color: #0ea5e9;
    animation: pulse 1s ease-in-out 0.5s infinite alternate;
}

.meter {
    flex: none;
    width: 100px;
    height: 24px;
    background-color: #6366f1;
    transition: width 0.3s linear;
}
.meter.wide { width: 300px; }

#status { margin: 0; height: 20px; }

@media (min-width: 99999999px) {
    .fader, .meter { transition: none; }
    .spinner, .pulse { animation: none; }
}
</style></head><body><div class="page"><div id="shapes" class="row"><div id="rotate" class="cell"><div id="rotate-inner" class="inner"></div></div><div id="scale" class="cell"><div id="scale-inner" class="inner"></div></div><div id="skew" class="cell"><div id="skew-inner" class="inner"></div></div><div id="origin" class="cell"><div id="origin-inner" class="inner"></div></div><div id="combo" class="cell"><div id="combo-inner" class="inner"></div></div></div><div id="fade-row" class="row"><div id="fader" class="fader"></div><button id="toggle">Toggle</button></div><div id="loop-row" class="row"><div id="spinner" class="spinner"></div><div id="pulse" class="pulse"></div></div><div id="meter-row" class="row"><div id="meter" class="meter"></div><button id="grow">Grow</button></div><p id="status">Last click: nothing</p></div></body></html>
