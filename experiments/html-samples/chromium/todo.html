<!doctype html>
<html><head><style>
* { box-sizing: border-box; }
html, body { margin: 0; }
body { font-family: system-ui, sans-serif; font-size: 14px; color: #1f2937; background-color: #ffffff; }

.todo-app { padding: 16px; }
.todo-app h1 { margin: 0 0 12px; font-size: 20px; }

.new-todo { display: flex; gap: 8px; margin-bottom: 12px; }
.new-todo input {
    flex: 1;
    min-width: 0;
    height: 32px;
    padding: 0 8px;
    border: 1px solid #d1d5db;
    border-radius: 6px;
}
.new-todo button {
    width: 64px;
    height: 32px;
    padding: 0;
    border: 0;
    border-radius: 6px;
    background-color: #2563eb;
    color: #ffffff;
}

.todos { list-style: none; margin: 0; padding: 0; }
.todo {
    display: flex;
    align-items: center;
    gap: 8px;
    height: 40px;
    border-bottom: 1px solid #e5e7eb;
}
.todo input { width: 16px; height: 16px; margin: 0; }
.todo .title { flex: 1; }
.todo button {
    width: 64px;
    height: 28px;
    padding: 0;
    border: 1px solid #d1d5db;
    border-radius: 4px;
    background-color: #ffffff;
    color: #374151;
}
.todo button:disabled { color: #d1d5db; }
.todo.done { background-color: #f9fafb; }
.todo.done .title { color: #9ca3af; text-decoration: line-through; }

.empty { margin: 0; color: #6b7280; }
</style></head><body><div class="todo-app"><h1>Todos</h1><form id="new-todo-form" class="new-todo"><input id="new-todo" placeholder="What needs doing?" value=""><button id="add" type="submit">Add</button></form><ul id="todos" class="todos"><li id="todo-1" class="todo"><input type="checkbox" id="toggle-1"><span class="title">Buy milk</span><button id="up-1" disabled="true">Up</button><button id="down-1">Down</button><button id="delete-1">Delete</button></li><li id="todo-2" class="todo"><input type="checkbox" id="toggle-2"><span class="title">Write tests</span><button id="up-2">Up</button><button id="down-2">Down</button><button id="delete-2">Delete</button></li><li id="todo-3" class="todo"><input type="checkbox" id="toggle-3"><span class="title">Call mom</span><button id="up-3">Up</button><button id="down-3" disabled="true">Down</button><button id="delete-3">Delete</button></li></ul></div></body></html>
