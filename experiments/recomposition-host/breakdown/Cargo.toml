# Deliberately outside the workspace. This measures the workspace's crate but is not part
# of what the project publishes, and its own `[workspace]` keeps it out of the member list
# and out of the shared build directory.
[workspace]

[package]
name = "recomposition-breakdown"
edition = "2024"
publish = false

[dependencies]
dioxus-compose = { path = "../../../dioxus-compose" }
dioxus-core = "0.7.10"

[profile.release]
debug = true
