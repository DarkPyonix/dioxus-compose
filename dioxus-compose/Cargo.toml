[package]
name = "dioxus-compose"
# 0.0.0 on purpose: the boundary works and so do the desktop and iOS renderers, but the
# widget vocabulary is still being filled in and nothing here is stable yet. A number that
# says so is more honest than one that implies a first usable release.
version = "0.0.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Declarative UI in Rust, rendered by an AOT-compiled Compose Multiplatform engine"
repository = "https://github.com/DarkPyonix/dioxus-compose"
homepage = "http://darkpyonix.dev/dioxus-compose/"
keywords = ["ui", "gui", "dioxus", "compose", "desktop"]
categories = ["gui"]
readme = "../README.md"

[lib]
crate-type = ["rlib", "cdylib", "staticlib"]
# The lib has no #[bench] items, but `cargo bench` would still run its default test
# harness, which rejects Criterion's flags (--quick, --noplot). Benchmarks live in
# benches/host.rs with harness = false.
bench = false

[[bin]]
name = "codegen"
path = "src/bin/codegen.rs"
bench = false

[features]
default = []
mock-renderer = []
native-renderer = []

[dependencies]
dioxus-core.workspace = true
dioxus-core-macro.workspace = true
dioxus-hooks.workspace = true
dioxus-signals.workspace = true

[dev-dependencies]
criterion = "0.7"

[[bench]]
name = "host"
harness = false

[[example]]
name = "desktop_demo"
required-features = ["native-renderer"]
