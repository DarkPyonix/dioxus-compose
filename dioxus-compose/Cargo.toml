[package]
name = "dioxus-compose"
# 0.0.0 on purpose: the boundary works and so do the desktop and iOS renderers, but the
# widget vocabulary is still being filled in and nothing here is stable yet. A number that
# says so is more honest than one that implies a first usable release.
version = "0.0.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "A Dioxus renderer that draws HTML and CSS natively with Compose Multiplatform through compose-rust, with no webview"
repository = "https://github.com/DarkPyonix/dioxus-compose"
homepage = "http://darkpyonix.dev/dioxus-compose/"
keywords = ["ui", "gui", "dioxus", "compose", "desktop"]
categories = ["gui"]
readme = "../README.md"

[lib]
# An rlib only. The boundary's C, JNI and wasm exports are compose-rust's, and so is the
# cdylib and staticlib that carry them: an application's own crate is the shared library
# or the archive (see the samples), and this crate is linked into it like any other.
# The lib has no #[bench] items, but `cargo bench` would still run its default test
# harness, which rejects Criterion's flags (--quick, --noplot). Benchmarks live in
# benches/host.rs with harness = false.
bench = false

[features]
# The renderer is compose-rust's to find, download and link. These only pass the choice
# through, so an application that names this crate alone gets compose-rust's defaults:
# `native-renderer` resolves or downloads the renderer for the target, and
# `mock-renderer` drives the boundary with no renderer at all, for tests and for
# embedding the Host in something that draws for itself.
default = ["native-renderer"]
mock-renderer = ["compose-rust/mock-renderer"]
native-renderer = ["compose-rust/native-renderer"]

[dependencies]
# The boundary, the protocol, the schema and the renderer it links. Pinned to one commit,
# because the records the Host writes and the renderer reads are versioned together: a
# different compose-rust is a different wire format.
compose-rust = { git = "https://github.com/DarkPyonix/compose-rust", rev = "22822c130a8211de7f65e0320db5e6a4db1a8bb1", default-features = false }
dioxus-core.workspace = true
dioxus-core-macro.workspace = true
dioxus-hooks.workspace = true
dioxus-signals.workspace = true
# Element and event definitions for `div`, `span`, `onclick` and the rest, for screens
# written with HTML elements and CSS. Without `serialize`: nothing here crosses a wire as
# JSON.
dioxus-html = { version = "0.7.10", default-features = false }

# Screens written with HTML and CSS are laid out inside the Host by blitz-dom. Pinned to
# the versions experiments/blitz-layout-probe was measured against, so a later release
# cannot move a box without anyone noticing.
blitz-dom = "=0.2.4"
blitz-html = "=0.2.0"
blitz-traits = "=0.2.0"
# The versions blitz-dom 0.2.4 resolves. Named here because the layout pass reads Parley's
# lines and stylo's computed values directly.
parley = "=0.6.0"
style = { package = "stylo", version = "=0.8.0" }
# The same Taffy blitz-dom drives, with the same algorithms switched on: the layout pass
# implements Taffy's tree traits over blitz-dom's nodes.
taffy = { version = "0.9", default-features = false, features = [
    "std",
    "flexbox",
    "grid",
    "block_layout",
    "content_size",
    "calc",
] }

# Criterion is not built for the browser. Its default features pull in rayon, which
# refuses to compile for a wasm target, and building the Host as a wasm module compiles
# dev-dependencies because an example is a dev target. The benchmarks only ever run on the
# machine that records their numbers.
[target.'cfg(not(target_family = "wasm"))'.dev-dependencies]
criterion = "0.7"

[[bench]]
name = "host"
harness = false

# What one frame of the HTML and CSS path costs the Host. Its recorded numbers are under
# `html_frame` in benches/baseline.json.
[[bench]]
name = "html_frame"
harness = false

[[example]]
name = "desktop_demo"
required-features = ["native-renderer"]

# The browser's Host is a wasm module the page fetches. It has no `main` either: the
# Renderer's module owns the loop, and `web_main!` registers this example's root component
# from the entry point the page calls once both modules exist.
[[example]]
name = "web_demo"
crate-type = ["cdylib"]
