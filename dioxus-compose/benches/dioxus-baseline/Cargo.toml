# The Dioxus side of the comparison the compose-rust runtime is measured against.
#
# The rsx! versions of the native widget samples, gathered under one name. compose-rust's
# own authoring API is being written against the same screens, and this is the thing that
# rewrite is compared with, screen for screen.
#
# It lives here because the Dioxus path does: this crate, the samples and dioxus-compose
# all move together, and compose-rust's dependency graph has nothing Dioxus in it.

[package]
name = "dioxus-baseline"
version = "0.0.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[lib]
bench = false

[dependencies]
dioxus-compose.workspace = true
sample-academic = { path = "../../../samples/native-widgets/academic" }
sample-calculator = { path = "../../../samples/native-widgets/calculator" }
sample-chat = { path = "../../../samples/native-widgets/chat" }
sample-minimal = { path = "../../../samples/native-widgets/minimal" }
sample-notepad = { path = "../../../samples/native-widgets/notepad" }
sample-podcast = { path = "../../../samples/native-widgets/podcast" }
sample-selfcare = { path = "../../../samples/native-widgets/selfcare" }
sample-social = { path = "../../../samples/native-widgets/social" }
sample-statistics = { path = "../../../samples/native-widgets/statistics" }
sample-store = { path = "../../../samples/native-widgets/store" }
sample-todo = { path = "../../../samples/native-widgets/todo" }
