[workspace]
members = [
    "dioxus-compose",
    "samples/academic",
    "samples/calculator",
    "samples/chat",
    "samples/frames",
    "samples/minimal",
    "samples/notepad",
    "samples/podcast",
    "samples/selfcare",
    "samples/social",
    "samples/statistics",
    "samples/store",
    "samples/todo",
]
resolver = "2"

[workspace.package]
edition = "2024"
license = "Apache-2.0"
# The HTML and CSS path pulls in stylo, whose icu_* 2.3 crates and encoding_rs 0.8.42
# declare 1.88 (blitz-dom 0.2.4 itself declares 1.86).
rust-version = "1.88"

[workspace.dependencies]
dioxus-core = "0.7.10"
dioxus-core-macro = "0.7.10"
dioxus-hooks = "0.7"
dioxus-signals = "0.7"
