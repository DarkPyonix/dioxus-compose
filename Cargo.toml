[workspace]
members = [
    "dioxus-compose",
    "samples/academic",
    "samples/calculator",
    "samples/chat",
    "samples/frames",
    "samples/minimal",
    "samples/notepad",
    "samples/podcast",
    "samples/selfcare",
    "samples/social",
    "samples/statistics",
    "samples/store",
    "samples/todo",
]
resolver = "2"

[workspace.package]
edition = "2024"
license = "Apache-2.0"
# blitz-dom 0.2.4, which lays out the HTML and CSS path, declares 1.86.
rust-version = "1.86"

[workspace.dependencies]
dioxus-core = "0.7.10"
dioxus-core-macro = "0.7.10"
dioxus-hooks = "0.7"
dioxus-signals = "0.7"
